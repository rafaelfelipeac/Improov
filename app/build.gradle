apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'androidx.navigation.safeargs'

android {
    namespace "com.rafaelfelipeac.improov"
    compileSdkVersion 35

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.rafaelfelipeac.improov"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 23
        versionName "1.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            resValue "string", "app_name", "@string/app_name_release"
            resValue "string", "file_provider_path", "@string/file_provider_release"
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'

            resValue "string", "app_name", "@string/app_name_debug"
            resValue "string", "file_provider_path", "@string/file_provider_debug"
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.resValue "string", "versionName", variant.versionName
    }

    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar'])

        // Android
        implementation 'androidx.preference:preference-ktx:1.2.1'
        implementation 'com.google.android.material:material:1.12.0'

        // Kotlin
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"

        // LiveData & ViewModel
        implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
        implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.2.0'
        implementation "androidx.lifecycle:lifecycle-common-java8:2.2.0"

        // Room
        kapt 'androidx.room:room-compiler:2.6.1'
        implementation 'androidx.room:room-runtime:2.6.1'

        // Navigation
        implementation "androidx.navigation:navigation-fragment-ktx:2.3.0"
        implementation "androidx.navigation:navigation-ui-ktx:2.3.0"

        // Dagger 2
        kapt "com.google.dagger:dagger-compiler:2.51.1"
        implementation "com.google.dagger:dagger:2.51.1"

        // DecoView
        implementation 'com.github.bmarrdev:android-DecoView-charting:v1.2'

        // GifView
        implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.19'

        // Gson
        implementation 'com.google.code.gson:gson:2.8.6'

        // Coroutines
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.0'

        // Test
        testImplementation 'junit:junit:4.13'
        testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.4.0'
        testImplementation 'androidx.arch.core:core-testing:2.2.0'
        testImplementation 'org.mockito:mockito-inline:5.2.0'
        testImplementation  'androidx.test:core:1.3.0'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
        androidTestImplementation 'androidx.test:runner:1.3.0'
        androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    }
}
